- id: test-007
  question: Among customer states with at least 1,000 delivered orders, which 5 have the highest late
    delivery rate?
  difficulty: hard
  tags: [delivery, customer]
  reference_sql: |
    SELECT customer_state, (COUNT(*) FILTER (WHERE is_late))::numeric / NULLIF(COUNT(is_late), 0) AS late_delivery_rate
    FROM orders
    GROUP BY customer_state
    HAVING COUNT(*) FILTER (WHERE is_delivered) >= 1000
    ORDER BY late_delivery_rate DESC
    LIMIT 5
  compare: {order_matters: true, abs_tol: '0.0005', allow_percent: true}
  reference_result:
    columns:
    - {name: customer_state, type: text}
    - {name: late_delivery_rate, type: number}
    rows:
    - [CE, '0.13760750586395621579']
    - [BA, '0.12162162162162162162']
    - [RJ, '0.12105263157894736842']
    - [ES, '0.10726817042606516291']
    - [PE, '0.09604519774011299435']
  verified_by: null
  verified_on: null
  verified_hash: null
