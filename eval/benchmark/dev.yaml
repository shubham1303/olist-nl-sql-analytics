- id: dev-030
  question: What is the median delivery time in days for delivered orders?
  difficulty: medium
  tags: [delivery, aggregation]
  reference_sql: |
    SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY delivery_days) AS median_delivery_days FROM orders
  compare: {abs_tol: '0.01'}
  reference_result:
    columns:
    - {name: median_delivery_days, type: number}
    rows:
    - ['10.22']
