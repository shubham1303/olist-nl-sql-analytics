- id: dev-017
  question: What was the month-over-month revenue growth rate for each month from February to August 2018?
  difficulty: hard
  tags: [time_series, multi_step]
  reference_sql: |
    WITH monthly AS (
      SELECT purchase_month, SUM(revenue) AS revenue
      FROM orders
      WHERE purchased_at >= '2018-01-01' AND purchased_at < '2018-09-01'
      GROUP BY purchase_month
    )
    SELECT purchase_month,
           (revenue - LAG(revenue) OVER (ORDER BY purchase_month)) / LAG(revenue) OVER (ORDER BY purchase_month) AS growth_rate
    FROM monthly
    ORDER BY purchase_month
    OFFSET 1
  compare: {order_matters: true, abs_tol: '0.0005', allow_percent: true}
  reference_result:
    columns:
    - {name: purchase_month, type: date}
    - {name: growth_rate, type: number}
    rows:
    - ['2018-02-01', '-0.11376608431046558482']
    - ['2018-03-01', '0.17085142712856185407']
    - ['2018-04-01', '0.01278416640210347461']
    - ['2018-05-01', '-0.00072588073236990865']
    - ['2018-06-01', '-0.13053671836266869311']
    - ['2018-07-01', '0.01711957617489951209']
    - ['2018-08-01', '-0.03323769768465091174']
  verified_by: Shubham More
  verified_on: '2026-10-09'
  verified_hash: 993f76db522a7a5580aced227124743ac5cbd5d6c785f67fb2fe40f2531481fc
- id: dev-018
  question: What is the repeat customer rate?
  difficulty: hard
  tags: [customer, multi_step]
  reference_sql: |
    SELECT (COUNT(*) FILTER (WHERE c.delivered_orders >= 2))::numeric / NULLIF(COUNT(*), 0) AS repeat_customer_rate
    FROM (SELECT customer_unique_id, COUNT(*) AS delivered_orders
          FROM orders
          WHERE is_delivered
          GROUP BY customer_unique_id) AS c
  compare: {abs_tol: '0.0005', allow_percent: true}
  notes: 'Catalog definition: customers with 2+ delivered orders / customers with 1+ delivered order.'
  reference_result:
    columns:
