[project]
name = "olist-nlsql"
version = "0.1.0"
description = "Natural-language-to-SQL analytics over the Olist e-commerce dataset"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local PostgreSQL driver. Not needed in AWS, where the RDS Data API is used (ADR 0001).
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "olist-nlsql[postgres]",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "S",       # bandit (security)
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests: assert is expected; SQL is built from trusted catalog/view names (S608); long
# SQL literals cannot be wrapped by the formatter (E501).
"tests/**" = ["S101", "S608", "E501"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not integration and not live"]
markers = [
    "integration: requires the local Docker Postgres database",
    "live: calls real AWS services (costs money); always opt-in",
]
