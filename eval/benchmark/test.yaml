- id: test-014
  question: What were the top 3 product categories by revenue in each of 2017 and 2018?
  difficulty: hard
  tags: [product_category, time_series, multi_step]
  reference_sql: |
    WITH yearly AS (
      SELECT EXTRACT(YEAR FROM purchased_at) AS year, product_category, SUM(revenue) AS revenue
      FROM order_items
      WHERE purchased_at >= '2017-01-01' AND purchased_at < '2019-01-01'
      GROUP BY EXTRACT(YEAR FROM purchased_at), product_category
    ), ranked AS (
      SELECT year, product_category, revenue,
             ROW_NUMBER() OVER (PARTITION BY year ORDER BY revenue DESC) AS rank
      FROM yearly
    )
    SELECT year, product_category, revenue
    FROM ranked
    WHERE rank <= 3
  reference_result:
    columns:
    - {name: year, type: number}
    - {name: product_category, type: text}
    - {name: revenue, type: number}
    rows:
    - ['2017', bed_bath_table, '497970.94']
    - ['2017', watches_gifts, '486519.02']
    - ['2017', health_beauty, '481142.73']
    - ['2018', health_beauty, '770002.81']
    - ['2018', watches_gifts, '708305.95']
    - ['2018', bed_bath_table, '537514.13']
  verified_by: null
  verified_on: null
  verified_hash: null
