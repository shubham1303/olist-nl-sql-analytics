- id: dev-029
  question: How many new customers made their first purchase in each month of 2017?
  difficulty: hard
  tags: [customer, time_series, multi_step]
  reference_sql: |
    WITH first_orders AS (
      SELECT customer_unique_id, MIN(purchased_at) AS first_purchased_at
      FROM orders
      GROUP BY customer_unique_id
    )
    SELECT DATE_TRUNC('month', first_purchased_at) AS month, COUNT(*) AS new_customers
    FROM first_orders
    WHERE first_purchased_at >= '2017-01-01' AND first_purchased_at < '2018-01-01'
    GROUP BY DATE_TRUNC('month', first_purchased_at)
    ORDER BY month
  compare: {order_matters: true}
  notes: A customer's first order of any status counts as their first purchase.
  reference_result:
    columns:
    - {name: month, type: timestamp}
    - {name: new_customers, type: integer}
