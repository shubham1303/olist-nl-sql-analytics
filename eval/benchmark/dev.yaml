- id: dev-020
  question: Among product categories with at least 500 reviewed orders, which 5 have the lowest average
    review score? Ignore products without a category.
  difficulty: hard
  tags: [product_category, review]
  reference_sql: |
    SELECT product_category, AVG(review_score) AS average_review_score
    FROM order_categories
    WHERE product_category <> 'uncategorized'
    GROUP BY product_category
    HAVING COUNT(review_score) >= 500
    ORDER BY average_review_score
    LIMIT 5
  compare: {order_matters: true, abs_tol: '0.0005'}
  notes: '''uncategorized'' is the label for products without a category, so it is excluded. 5th vs 6th:
    4.026 vs 4.038, no tie.'
  reference_result:
