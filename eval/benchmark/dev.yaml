- id: dev-007
  question: How many orders were placed in each month of 2018?
  difficulty: medium
  tags: [time_series, aggregation]
  reference_sql: |
    SELECT purchase_month, COUNT(*) AS orders
    FROM orders
    WHERE purchased_at >= '2018-01-01' AND purchased_at < '2019-01-01'
    GROUP BY purchase_month
    ORDER BY purchase_month
